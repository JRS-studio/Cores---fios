<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esmalte Express</title>
<!-- Jogo do app Cores & Fios. Roda dentro do app (tela Jogo): recebe o modo e o prêmio pela URL
     (?modo=teste|valendo&premio=...) e, no fim da partida, manda a pontuação para o app com postMessage.
     Quem salva no ranking é o app, com o login da cliente; esta página não grava nada. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600;1,700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fcf8f6; --surface: #ffffff; --blush: #f7ece8; --line: #eadcd6; --ink: #2a1f24; --muted: #76666c;
  --plum: #2b1220; --wine: #7a2e4a; --rose: #c9a27e; --rose-light: #e8cdb5; --on-plum: #ffffff; --bad: #b8441f;
  --shadow: 0 18px 40px -22px rgb(43 18 32 / 0.45);
  --display: "Playfair Display", Georgia, serif;
  --text: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #170b12; --surface: #221019; --blush: #2e1621; --line: #432433; --ink: #f8ecf1; --muted: #c9adb9;
    --plum: #e8cdb5; --wine: #e79bb7; --rose: #d8b28c; --rose-light: #f1dcc7; --on-plum: #2b1220; --bad: #ff9a72;
    --shadow: 0 18px 40px -22px rgb(0 0 0 / 0.8); color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.app { max-width: 480px; margin: 0 auto; padding: 10px max(14px, env(safe-area-inset-left, 0px)) 24px; display: grid; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.mode { justify-self: center; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.mode.teste { background: #fff1d6; color: #7a4a00; }
.mode.valendo { background: linear-gradient(145deg, #f6dc8c, #c79a2b); color: #3a2706; }

.hud { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.score-box .lbl { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.score-box .val { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; }
.timer { position: relative; width: 50px; height: 50px; }
.timer svg { width: 50px; height: 50px; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 4; }
.timer .track { stroke: var(--blush); }
.timer .ring { stroke: var(--rose); stroke-linecap: round; transition: stroke .3s; }
.timer.low .ring { stroke: var(--bad); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 15px; }

.ticket { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 14px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line); }
.ticket.vip { border-color: #d9a93a; box-shadow: 0 0 0 1px rgb(217 169 58 / .4) inset; }
.ticket .t1 { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ticket .client { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.15; }
.ticket .style { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { grid-row: span 3; display: flex; gap: 5px; align-items: flex-end; }
.chips i { width: 13px; border-radius: 7px 7px 5px 5px; box-shadow: inset 0 -3px 0 rgb(0 0 0 / .14), inset 2px 2px 0 rgb(255 255 255 / .35); }
.chips i.now { outline: 2px solid var(--rose); outline-offset: 2px; }
.vip-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 99px; font-family: var(--text); font-size: 10px; font-weight: 700;
  background: linear-gradient(145deg, #f6dc8c, #c79a2b); color: #3a2706; vertical-align: 3px; }

.stage { position: relative; overflow: hidden; aspect-ratio: 1000 / 582; width: 100%; border-radius: 24px; background: #1d1418; box-shadow: var(--shadow); }
.hand-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.combo { position: absolute; right: 10px; top: 10px; z-index: 2; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 12px;
  background: rgb(255 255 255 / .88); color: #2a1f24; }
.combo.hot { background: linear-gradient(145deg, #f6dc8c, #c79a2b); color: #3a2706; }
.float { position: absolute; left: 50%; top: 30%; transform: translate(-50%, 0); pointer-events: none; z-index: 3;
  font-family: var(--display); font-weight: 700; font-size: 26px; color: #fff; animation: rise .85s ease forwards; white-space: nowrap;
  text-shadow: 0 2px 12px rgb(43 18 32 / .85), 0 0 2px rgb(43 18 32 / .6); }
.float.bad { color: #ffd2c2; } .float.big { font-size: 28px; font-style: italic; color: #f6dc8c; }
@keyframes rise { to { transform: translate(-50%, -60px); opacity: 0; } }
.count3 { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; font-family: var(--display); font-style: italic; font-weight: 700;
  font-size: 96px; color: #fff; background: rgb(43 18 32 / .45); }
.wipe { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.nail.painted .wipe { transform: scaleY(1); }
.aim { opacity: 0; }
.nail.target .aim { opacity: 1; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -32; } }
.nail.shake { animation: shake .32s; }
@keyframes shake { 20%,60% { opacity: .55; } 40%,80% { opacity: 1; } }
.blend-mul { mix-blend-mode: multiply; } .blend-scr { mix-blend-mode: screen; }

.bottles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bottle { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 7px 2px 6px; display: grid; justify-items: center; gap: 2px; min-width: 0;
  transition: transform .1s ease, border-color .15s; touch-action: manipulation; box-shadow: 0 6px 14px -12px rgb(43 18 32 / .5); }
.bottle:active { transform: scale(.94); }
.bottle svg { width: 28px; height: 44px; filter: drop-shadow(0 4px 5px rgb(43 18 32 / .25)); }
.bottle span { font-size: 9.5px; font-weight: 500; line-height: 1.2; text-align: center; color: var(--muted); }
.bottle.wrong { border-color: var(--bad); }

.panel { text-align: center; display: grid; gap: 8px; padding: 22px 18px; border-radius: 26px; color: #fff;
  background: radial-gradient(90% 70% at 50% 0%, rgb(232 205 181 / .25), transparent 60%), linear-gradient(160deg, #4a1d33, #2b1220); box-shadow: var(--shadow); }
.panel .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #e8cdb5; }
.panel h1 { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0; }
.panel h1 em { font-style: italic; color: #e8cdb5; }
.panel p { margin: 0; color: rgb(255 255 255 / .8); font-size: 13px; }
.panel .big { font-family: var(--display); font-weight: 700; font-size: 68px; line-height: 1; }
.stats { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; color: rgb(255 255 255 / .75); font-size: 12.5px; }
.stats b { color: #fff; font-weight: 600; }
.status { min-height: 1.4em; font-size: 13px; color: #f6dc8c; }
.btn { border: 0; border-radius: 999px; padding: 15px 22px; font-weight: 600; font-size: 15px; width: 100%; background: var(--plum); color: var(--on-plum);
  box-shadow: 0 14px 28px -16px rgb(43 18 32 / .8); }
.btn.light { background: #e8cdb5; color: #2b1220; box-shadow: none; }
.rules { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; text-align: left; font-size: 12.5px; color: rgb(255 255 255 / .82); }
.rules li::before { content: "•"; color: #e8cdb5; margin-right: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="mode" id="mode"></div>

  <section id="v-start" class="panel">
    <div class="eyebrow" id="start-eyebrow">Jogue e ganhe</div>
    <h1>Esmalte <em>Express</em></h1>
    <p id="prize-line"></p>
    <ul class="rules">
      <li>Pinte cada unha com a cor da ficha, da esquerda para a direita.</li>
      <li>São 10 cores e os vidros mudam de lugar a cada cliente.</li>
      <li>Acertos seguidos multiplicam os pontos até 5×. Erro tira 2 segundos.</li>
    </ul>
    <button class="btn light" id="start">Começar · 60s</button>
  </section>

  <section id="v-game" hidden style="display:grid;gap:12px">
    <div class="hud">
      <div class="score-box"><div class="lbl">Pontos</div><div class="val tabular" id="score">0</div></div>
      <div class="timer" id="timer" aria-label="Tempo restante">
        <svg viewBox="0 0 50 50" aria-hidden="true"><circle class="track" cx="25" cy="25" r="21"/><circle class="ring" id="ring" cx="25" cy="25" r="21" stroke-dasharray="131.95" stroke-dashoffset="0"/></svg>
        <span class="tabular" id="time">60</span>
      </div>
    </div>
    <div class="ticket" id="ticket" aria-live="polite"></div>
    <div class="stage" id="stage">
      <svg class="hand-svg" id="hand" viewBox="0 0 1000 582" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mão da cliente"></svg>
      <div class="combo tabular" id="combo">Combo 1×</div>
      <div class="count3" id="count3" hidden>3</div>
    </div>
    <div class="bottles" id="bottles"></div>
  </section>

  <section id="v-end" hidden class="panel">
    <div class="eyebrow">Sua pontuação</div>
    <div class="big tabular" id="final">0</div>
    <div class="stats tabular" id="stats"></div>
    <div class="status" id="status" role="status"></div>
    <button class="btn light" id="again">Jogar de novo</button>
  </section>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const MODE = params.get('modo') === 'valendo' ? 'valendo' : 'teste';
  const PRIZE = params.get('premio') || '';
  const HAND = 'mao.jpg';
  const ROUND_MS = 60000;
  const $ = (id) => document.getElementById(id);
  const rand = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rand(a.length)];
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  // Avisa o app (a tela que abriu o jogo).
  const tell = (msg) => { try { window.parent.postMessage({ source: 'esmalte-express', ...msg }, '*'); } catch { /* fora do app */ } };

  $('mode').className = 'mode ' + MODE;
  $('mode').textContent = MODE === 'teste' ? 'Modo teste · não vale para o ranking' : 'Valendo para o ranking';
  $('prize-line').textContent = PRIZE ? 'Prêmio para a 1ª colocada: ' + PRIZE : 'Pinte o máximo de mãos em 60 segundos.';
  if (MODE === 'teste') $('start-eyebrow').textContent = 'Teste do jogo';

  const POLISH = [
    { id: 'vermelho', name: 'Vermelho Paixão', c: '#c8102e' }, { id: 'nude', name: 'Nude Rosé', c: '#d99a8a' },
    { id: 'pink', name: 'Rosa Chiclete', c: '#ee4f95' }, { id: 'vinho', name: 'Vinho', c: '#6e1a37' },
    { id: 'lilas', name: 'Lilás', c: '#9f7fd6' }, { id: 'azul', name: 'Azul Céu', c: '#4f93db' },
    { id: 'menta', name: 'Verde Menta', c: '#4fbf92' }, { id: 'preto', name: 'Preto Ônix', c: '#1f1c22' },
    { id: 'coral', name: 'Coral', c: '#f2643c' }, { id: 'amarelo', name: 'Amarelo Manteiga', c: '#f1c84b' },
  ];
  const STYLES = ['Trio espelhado', 'Degradê', 'Filhas únicas', 'Mix de 4 cores', 'Arco-íris'];
  const CLIENTS = ['Bia', 'Camila', 'Dona Lúcia', 'Júlia', 'Marina', 'Paula', 'Rafa', 'Sofia', 'Tati', 'Vó Cida', 'Lara', 'Helena'];

  function bottleSvg(color) {
    return '<svg viewBox="0 0 34 54" aria-hidden="true"><rect x="11" y="1" width="12" height="16" rx="3.5" fill="#1e1419"/>' +
      '<rect x="12.8" y="3" width="2.4" height="12" rx="1.2" fill="#fff" opacity=".28"/><rect x="9.5" y="16" width="15" height="3.5" rx="1.5" fill="#c9a27e"/>' +
      '<path d="M5 20h24l3.2 26.5A5 5 0 0 1 27.3 52H6.7a5 5 0 0 1-4.9-5.5z" fill="' + color + '"/>' +
      '<path d="M5 20h24l3.2 26.5A5 5 0 0 1 27.3 52H6.7a5 5 0 0 1-4.9-5.5z" fill="url(#glass)"/>' +
      '<path d="M7.6 24h3.4l-1.1 23.5H6.4z" fill="#fff" opacity=".42"/><path d="M25 25h1.4l1.2 18h-1.4z" fill="#fff" opacity=".2"/></svg>';
  }
  document.body.insertAdjacentHTML('afterbegin', '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
    '<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>' +
    '<stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient></defs></svg>');

  // Unhas da foto, da esquerda para a direita: cutícula, ponta e largura em pixels da foto (1000 × 582).
  const NAILS = [
    { c: [46, 356], t: [150, 572], w: 100 }, { c: [288, 352], t: [497, 540], w: 140 }, { c: [456, 272], t: [688, 474], w: 142 },
    { c: [620, 190], t: [856, 424], w: 140 }, { c: [792, 114], t: [970, 336], w: 134 },
  ];
  const f1 = (n) => n.toFixed(1);
  function nailShape(L, w) {
    const h = w / 2;
    return 'M' + f1(-h) + ',' + f1(w * 0.42) + ' C' + f1(-h) + ',' + f1(-0.06 * w) + ' ' + f1(h) + ',' + f1(-0.06 * w) + ' ' + f1(h) + ',' + f1(w * 0.42) +
      ' C' + f1(h) + ',' + f1(L * 0.72) + ' ' + f1(w * 0.3) + ',' + f1(L * 0.98) + ' 0,' + f1(L) +
      ' C' + f1(-w * 0.3) + ',' + f1(L * 0.98) + ' ' + f1(-h) + ',' + f1(L * 0.72) + ' ' + f1(-h) + ',' + f1(w * 0.42) + ' Z';
  }
  function buildHand(nails) {
    let s = '<defs><filter id="hl" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".3 .55 .15 0 0 .3 .55 .15 0 0 .3 .55 .15 0 0 0 0 0 1 0"/>' +
      '<feComponentTransfer><feFuncR type="linear" slope="5.2" intercept="-4.05"/><feFuncG type="linear" slope="5.2" intercept="-4.05"/><feFuncB type="linear" slope="5.2" intercept="-4.05"/></feComponentTransfer></filter>' +
      '<filter id="sh" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".3 .55 .15 0 0 .3 .55 .15 0 0 .3 .55 .15 0 0 0 0 0 1 0"/>' +
      '<feComponentTransfer><feFuncR type="linear" slope="1.35" intercept="-0.02"/><feFuncG type="linear" slope="1.35" intercept="-0.02"/><feFuncB type="linear" slope="1.35" intercept="-0.02"/></feComponentTransfer></filter>' +
      '<filter id="feather" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>';
    const parts = [];
    NAILS.forEach((n, i) => {
      const dx = n.t[0] - n.c[0], dy = n.t[1] - n.c[1];
      const L = Math.hypot(dx, dy), ang = Math.atan2(-dx, dy) * 180 / Math.PI;
      const d = nailShape(L, n.w);
      s += '<mask id="nm' + i + '" maskUnits="userSpaceOnUse" x="' + f1(-n.w) + '" y="' + f1(-n.w) + '" width="' + f1(n.w * 2) + '" height="' + f1(L + n.w * 2) + '">' +
        '<path d="' + d + '" fill="#fff" filter="url(#feather)"/></mask>';
      const back = 'rotate(' + f1(-ang) + ') translate(' + (-n.c[0]) + ',' + (-n.c[1]) + ')';
      parts.push('<g transform="translate(' + n.c[0] + ',' + n.c[1] + ') rotate(' + f1(ang) + ')"><g class="nail" data-i="' + i + '"><g mask="url(#nm' + i + ')">' +
        '<g class="wipe"><rect x="' + f1(-n.w) + '" y="' + f1(-n.w * 0.2) + '" width="' + f1(n.w * 2) + '" height="' + f1(L + n.w * 0.4) + '" fill="' + nails[i].c + '"/></g>' +
        '<g class="wipe"><use class="blend-mul" href="#ph" transform="' + back + '" filter="url(#sh)"/></g>' +
        '<g class="wipe"><use class="blend-scr" href="#ph" transform="' + back + '" filter="url(#hl)"/></g></g>' +
        '<path class="aim" d="' + d + '" fill="none" stroke="#e8cdb5" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round"/>' +
        '<g class="hint" opacity="0"><circle cx="0" cy="' + f1(L * 0.5) + '" r="22" fill="' + nails[i].c + '" stroke="#fff" stroke-width="6"/></g></g></g>');
    });
    $('hand').innerHTML = s + '<image id="ph" href="' + HAND + '" width="1000" height="582"/></defs><use href="#ph"/>' + parts.join('');
  }
  function updateHand() {
    $('hand').querySelectorAll('.nail').forEach((el) => {
      const i = Number(el.dataset.i);
      el.classList.toggle('painted', i < game.idx);
      el.classList.toggle('target', i === game.idx && !game.countdown);
      el.querySelector('.hint').setAttribute('opacity', i === game.idx && !game.countdown ? '1' : '0');
    });
    document.querySelectorAll('#ticket .chips i').forEach((c, i) => c.classList.toggle('now', i === game.idx));
  }

  let audio = null;
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.05) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(audio.destination);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur); o.start(); o.stop(audio.currentTime + dur);
    } catch { /* sem som */ }
  }

  const game = { running: false };
  function show(view) { for (const v of ['start', 'game', 'end']) $('v-' + v).hidden = v !== view; window.scrollTo(0, 0); }

  // Toda ficha usa pelo menos 3 cores; depois de algumas mãos, 4; e mais tarde, 5. Os 10 vidros trocam de lugar a cada ficha.
  function newOrder() {
    const g = game;
    const [a, b, c, d, e] = shuffle(POLISH.slice());
    const style = g.done < 3 ? rand(3) : g.done < 7 ? rand(4) : 1 + rand(4);
    let nails;
    if (style === 0) nails = [a, b, c, b, a];
    else if (style === 1) nails = [a, a, b, c, c];
    else if (style === 2) nails = [a, b, a, c, a];
    else if (style === 3) nails = shuffle([a, b, c, d, pick([a, b, c, d])]);
    else nails = [a, b, c, d, e];
    g.order = { client: pick(CLIENTS), style: STYLES[style], nails, vip: (g.done + 1) % 5 === 0, startedAt: performance.now() };
    g.idx = 0;
    const el = $('ticket');
    el.className = 'ticket' + (g.order.vip ? ' vip' : '');
    el.innerHTML = '<div class="t1">Ficha nº ' + (g.done + 1) + '</div><div class="chips">' +
      nails.map((p, i) => '<i style="background:' + p.c + ';height:' + [19, 27, 30, 27, 22][i] + 'px"></i>').join('') + '</div><div class="client"></div><div class="style"></div>';
    el.querySelector('.client').textContent = g.order.client;
    if (g.order.vip) el.querySelector('.client').insertAdjacentHTML('beforeend', '<span class="vip-tag">VIP 2×</span>');
    el.querySelector('.style').textContent = g.order.style + ' · ' + nails.map((p) => p.name).filter((v, i, x) => x.indexOf(v) === i).join(', ');
    buildHand(nails);
    $('bottles').innerHTML = shuffle(POLISH.slice()).map((p) =>
      '<button class="bottle" data-p="' + p.id + '" aria-label="' + p.name + '">' + bottleSvg(p.c) + '<span>' + p.name + '</span></button>').join('');
    updateHand();
  }
  function floatText(text, cls) {
    const f = document.createElement('div'); f.className = 'float ' + (cls || ''); f.textContent = text;
    $('stage').appendChild(f); setTimeout(() => f.remove(), 860);
  }
  function updateHud() {
    $('score').textContent = game.score;
    const c = $('combo'); c.textContent = 'Combo ' + game.combo + '×'; c.classList.toggle('hot', game.combo >= 3);
  }
  $('bottles').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.bottle');
    if (!b || !game.running || game.countdown) return;
    e.preventDefault(); paint(b.dataset.p, b);
  });
  $('bottles').addEventListener('keydown', (e) => {
    const b = e.target.closest('.bottle');
    if (b && (e.key === 'Enter' || e.key === ' ') && game.running && !game.countdown) { e.preventDefault(); paint(b.dataset.p, b); }
  });
  function paint(id, btn) {
    const g = game, o = g.order;
    if (g.idx >= 5) return;
    if (id === o.nails[g.idx].id) {
      if (g.streak > 0 && g.streak % 3 === 2) g.combo = Math.min(5, g.combo + 1);
      g.streak += 1; g.correct += 1;
      const pts = 10 * g.combo * (o.vip ? 2 : 1);
      g.score += pts; beep(520 + g.idx * 70, 0.07, 'triangle');
      g.idx += 1; updateHand(); floatText('+' + pts);
      if (g.idx === 5) finishOrder();
    } else {
      g.combo = 1; g.streak = 0; g.mistakes += 1; g.endAt -= 2000;
      beep(160, 0.16, 'sawtooth', 0.04);
      const el = $('hand').querySelector('.nail[data-i="' + g.idx + '"]');
      if (el) { el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake'); }
      btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 300);
      floatText('−2s', 'bad');
    }
    updateHud();
  }
  function finishOrder() {
    const g = game, o = g.order;
    const secs = (performance.now() - o.startedAt) / 1000;
    const speed = secs < 4 ? 40 : secs < 6 ? 20 : 0;
    const bonus = (30 + speed) * (o.vip ? 2 : 1);
    g.score += bonus; g.done += 1; g.endAt += 2000;
    [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.09, 'triangle'), i * 70));
    setTimeout(() => floatText((speed ? 'Que rapidez! ' : 'Mão pronta! ') + '+' + bonus, 'big'), 180);
    setTimeout(() => game.running && newOrder(), 620);
    updateHud();
  }
  function frame() {
    if (!game.running) return;
    const left = Math.max(0, game.endAt - performance.now());
    $('time').textContent = Math.ceil(left / 1000);
    $('ring').setAttribute('stroke-dashoffset', String(131.95 * (1 - Math.min(1, left / ROUND_MS))));
    $('timer').classList.toggle('low', left < 10000);
    if (left <= 0) return stop();
    game.raf = requestAnimationFrame(frame);
  }
  function start() {
    show('game');
    Object.assign(game, { running: true, score: 0, combo: 1, streak: 0, correct: 0, mistakes: 0, done: 0, countdown: true });
    updateHud(); $('time').textContent = '60'; $('ring').setAttribute('stroke-dashoffset', '0'); $('timer').classList.remove('low');
    newOrder();
    const c3 = $('count3'); c3.hidden = false;
    let n = 3; c3.textContent = n; beep(440, 0.1);
    clearInterval(game.countTimer);
    game.countTimer = setInterval(() => {
      n -= 1;
      if (n > 0) { c3.textContent = n; beep(440, 0.1); return; }
      clearInterval(game.countTimer); c3.hidden = true; beep(880, 0.15);
      game.countdown = false; game.endAt = performance.now() + ROUND_MS;
      newOrder(); game.raf = requestAnimationFrame(frame);
    }, 650);
    tell({ type: 'start', mode: MODE });
  }
  function stop() {
    game.running = false; cancelAnimationFrame(game.raf); clearInterval(game.countTimer);
    const acc = game.correct + game.mistakes ? Math.round((game.correct / (game.correct + game.mistakes)) * 100) : 0;
    $('final').textContent = game.score;
    $('stats').innerHTML = '<span><b>' + game.done + '</b> mãos prontas</span><span><b>' + acc + '%</b> de acerto</span>';
    $('status').textContent = MODE === 'teste' ? 'Modo teste: esta pontuação não vai para o ranking.' : 'Salvando no ranking…';
    show('end');
    beep(523, 0.12, 'triangle'); setTimeout(() => beep(784, 0.18, 'triangle'), 120);
    tell({ type: 'result', mode: MODE, score: game.score, hands: game.done, accuracy: acc });
  }
  // Resposta do app depois de salvar (ex.: "Salvo! Você está em 2º lugar.").
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (e.source === window.parent && m && m.source === 'cores-app' && m.type === 'status' && typeof m.text === 'string') $('status').textContent = m.text;
  });
  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  tell({ type: 'ready' });
})();
</script>
</body>
</html>
